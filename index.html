<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuorten EM-kilpailut Countdown</title>
    <style>
        /* Pakotetaan tyylit tärkeysjärjestyksellä (!important) */
        html, body {
            background-color: #000000 !important;
            color: #ffffff !important;
            font-family: Arial, sans-serif !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }
        
        h1 {
            font-size: 2.2rem;
            color: #FFD700 !important; /* Keltainen otsikko */
            margin: 0 0 10px 0;
            text-transform: uppercase;
            padding: 0 20px;
        }
        
        h2 {
            font-size: 1.5rem;
            color: #aaaaaa !important;
            margin: 0 0 50px 0;
        }

        #countdown {
            display: flex;
            gap: 15px;
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff !important;
        }

        .time-box {
            background-color: #1a1a1a !important;
            padding: 20px;
            border-radius: 15px;
            min-width: 90px;
            border: 2px solid #333333 !important;
        }

        .label {
            font-size: 1rem;
            color: #888888 !important;
            display: block;
            margin-top: 10px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>22.-25.7. Nuorten EM-kilpailut (M/N22)</h1>
    <h2>Bydgoszcz, Puola</h2>
    
    <div id="countdown">
        <div class="time-box"><span id="days">0</span><span class="label">Päivää</span></div>
        <div class="time-box"><span id="hours">0</span><span class="label">Tuntia</span></div>
        <div class="time-box"><span id="minutes">0</span><span class="label">Minuuttia</span></div>
        <div class="time-box"><span id="seconds">0</span><span class="label">Sekuntia</span></div>
    </div>

    <script>
        // Asetetaan tavoiteajankohta: 25.7.2027 klo 12:00
        // HUOM: Jos tarkoitat vuotta 2026, vaihda 2027 -> 2026
        const targetDate = new Date('2027-07-25T12:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('countdown').innerHTML = "<h2>Tapahtuma on alkanut tai mennyt!</h2>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }

        // Päivitä joka sekunti
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
